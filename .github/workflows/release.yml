name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: oven-sh/setup-bun@v2

      # bun install supports workspace:* protocol natively (npm install does not).
      - run: bun install
        working-directory: .

      - run: bun run check
        working-directory: packages/statemachine
      - run: bun run build
        working-directory: packages/statemachine
      - run: node test/verify-dist.cjs
        working-directory: packages/statemachine
      - run: bun run knip
        working-directory: packages/statemachine

      # bun publish authenticates via the NPM_CONFIG_TOKEN env var — the
      # documented mechanism for CI/automation (bun's .npmrc `_authToken`
      # reading proved unreliable here: the token reached the runner and the
      # .npmrc was written, yet bun still emitted "missing authentication").
      # See https://bun.sh/docs/cli/publish — "bun publish respects the
      # NPM_CONFIG_TOKEN environment variable".
      # --strip-... / workspace: protocol stripping is automatic.
      # --tag beta routes pre-release versions to the `beta` dist-tag (not `latest`).
      - run: bun publish --access public --tag beta
        working-directory: packages/statemachine
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Auto-advance `latest` to the version just published, so `npm install`
      # (no tag) always resolves to the newest release. npm CLI authenticates
      # from ~/.npmrc `_authToken` (NOT NPM_CONFIG_TOKEN); requires NPM_TOKEN to
      # be an npm *automation* token to clear the 2FA gate on dist-tag writes.
      # NOTE: this moves `latest` on EVERY release — appropriate for a linear
      # release line; revisit if you ever backport to an older line.
      - name: Point latest at the just-published version
        working-directory: packages/statemachine
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "${NPM_TOKEN}" > ~/.npmrc
          echo "Moving latest -> @vedmalex/statemachine@${VERSION}"
          npm dist-tag add "@vedmalex/statemachine@${VERSION}" latest
          npm view "@vedmalex/statemachine" dist-tags
