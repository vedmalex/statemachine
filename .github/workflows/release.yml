name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      # `bun install` supports workspace:* protocol natively (npm install does not — see https://github.com/oven-sh/bun/blob/main/docs/pm/workspaces.mdx).
      # Examples in examples/integration/* depend on the package via workspace:*; that resolves only under bun's package manager.
      - run: bun install
        working-directory: .
      - run: bun run build
        working-directory: packages/statemachine
      - run: node test/verify-dist.cjs
        working-directory: packages/statemachine
      - run: bun run knip
        working-directory: packages/statemachine
      # bun publish automatically strips catalog and workspace protocols from package.json before publishing
      # (https://github.com/oven-sh/bun/blob/main/docs/pm/cli/publish.mdx).
      # workspace:* → resolved to actual version at publish time.
      - run: bun publish --access public
        working-directory: packages/statemachine
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
