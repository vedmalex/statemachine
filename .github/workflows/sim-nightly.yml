name: Sim Seed-Sweep

# TASK-014 Step 11 (D) — the DST seed-sweep. Each shard sweeps its slice of
# the candidate seed window through the safety+liveness oracles; on a violation
# the Step-7 shrinker writes a minimized repro that is uploaded as an artifact.
# The median-of-N perf REGRESSION (bands 20/25/30 + traceLen-zero, --expose-gc)
# also lives here, NOT on the PR leg (slow-runner-flake avoidance, Step 11 E).
#
# TASK-016 — EVENT-DRIVEN, no cron (the ai-connect CI pattern): the sweep
# enumerates a FIXED deterministic seed window [0, SIM_SWEEP_SEEDS), so
# re-running it on unchanged code reproduces the same result by construction —
# a daily schedule only burned CI minutes and mailed redundant failures. Runs
# on push to main (paths-filtered) + manual dispatch; the PR leg is ci.yml.

on:
  push:
    branches:
      - main
    paths:
      - "packages/statemachine/**"
      - ".github/workflows/sim-nightly.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push wins immediately.
concurrency:
  group: sim-sweep-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/statemachine

jobs:
  seed-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-workspaces
      - run: npm run build
      - name: Seed-sweep shard ${{ matrix.shard }}
        env:
          SM_SIM: "1"
          SIM_SHARD: "${{ matrix.shard }}"
          SIM_SHARDS: "8"
        run: npm run sim:sweep
      - name: Upload repro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-repro-shard-${{ matrix.shard }}
          path: packages/statemachine/.sim-out/**
          if-no-files-found: ignore
      - name: Open tracking issue on failure
        if: failure()
        continue-on-error: true
        run: echo "nightly sweep shard ${{ matrix.shard }} failed — see uploaded repro artifacts"

  # The perf REGRESSION gate runs ONCE per night, not once per shard — the gate
  # is identical in every shard, so running it inside the 8-way matrix just
  # multiplied the odds of a runner-noise false positive by 8 (TASK-015; the
  # baseline in etc/sim-perf.baseline.json is calibrated to THIS runner class).
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-workspaces
      - run: npm run build
      - name: Perf regression (median-of-5, --expose-gc)
        run: npm run sim:perf
