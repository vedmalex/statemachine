name: Set dist-tag

# Manually point an npm dist-tag (e.g. `latest`) at an already-published
# version. Uses the same NPM_CONFIG_TOKEN auth as the Release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to tag (e.g. 1.0.0-beta.2)"
        required: true
      tag:
        description: "Dist-tag to move (e.g. latest)"
        required: true
        default: latest

jobs:
  dist-tag:
    runs-on: ubuntu-latest
    steps:
      # npm CLI (unlike bun) authenticates from .npmrc `_authToken`, not from
      # NPM_CONFIG_TOKEN. NOTE: `npm dist-tag` is a 2FA-gated write — it succeeds
      # here only if NPM_TOKEN is an npm *automation* token (which bypasses 2FA);
      # a granular/classic publish token will get a 401/OTP wall.
      - name: Configure npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm dist-tag add "@vedmalex/statemachine@${{ inputs.version }}" "${{ inputs.tag }}"
      - run: npm view "@vedmalex/statemachine" dist-tags
